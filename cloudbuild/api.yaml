steps:
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env: ["RELEASE_SHA=$COMMIT_SHA", "RELEASE_TAG=$COMMIT_SHA-$BUILD_ID"]
    args:
      - -ceu
      - |
        test -n "$${RELEASE_SHA}"
        test -n "$${RELEASE_TAG}"
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: ["-c", "docker pull $_IMAGE_API || true"]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      [
        "DOCKER_BUILDKIT=1",
        "IMAGE_API_LATEST=$_IMAGE_API",
        "RELEASE_TAG=$COMMIT_SHA-$BUILD_ID",
      ]
    args:
      - -ceu
      - |
        api_image="$${IMAGE_API_LATEST%:*}:$${RELEASE_TAG}"
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg CACHE_BUST=$_CACHE_BUST \
          --cache-from "$${IMAGE_API_LATEST}" \
          -t "$${IMAGE_API_LATEST}" \
          -t "$${api_image}" \
          apps/api
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["IMAGE_API_LATEST=$_IMAGE_API", "RELEASE_TAG=$COMMIT_SHA-$BUILD_ID"]
    args:
      - -ceu
      - |
        api_image="$${IMAGE_API_LATEST%:*}:$${RELEASE_TAG}"
        docker push "$${api_image}"
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: ["-c", "docker pull $_IMAGE_WORKER || true"]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      [
        "DOCKER_BUILDKIT=1",
        "IMAGE_WORKER_LATEST=$_IMAGE_WORKER",
        "RELEASE_TAG=$COMMIT_SHA-$BUILD_ID",
      ]
    args:
      - -ceu
      - |
        worker_image="$${IMAGE_WORKER_LATEST%:*}:$${RELEASE_TAG}"
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg CACHE_BUST=$_CACHE_BUST \
          --cache-from "$${IMAGE_WORKER_LATEST}" \
          -f apps/api/Dockerfile.worker \
          -t "$${IMAGE_WORKER_LATEST}" \
          -t "$${worker_image}" \
          apps/api
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["IMAGE_WORKER_LATEST=$_IMAGE_WORKER", "RELEASE_TAG=$COMMIT_SHA-$BUILD_ID"]
    args:
      - -ceu
      - |
        worker_image="$${IMAGE_WORKER_LATEST%:*}:$${RELEASE_TAG}"
        docker push "$${worker_image}"
  # Resolve both release tags once, then carry immutable digest references
  # through every deployment step. This prevents a mutable tag from changing
  # the artifact deployed by a later step in the same release.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env:
      [
        "IMAGE_API_LATEST=$_IMAGE_API",
        "IMAGE_WORKER_LATEST=$_IMAGE_WORKER",
        "RELEASE_TAG=$COMMIT_SHA-$BUILD_ID",
      ]
    args:
      - -ceu
      - |
        api_image="$${IMAGE_API_LATEST%:*}:$${RELEASE_TAG}"
        worker_image="$${IMAGE_WORKER_LATEST%:*}:$${RELEASE_TAG}"

        api_digest="$$(gcloud artifacts docker images describe "$${api_image}" --format='value(image_summary.digest)')"
        worker_digest="$$(gcloud artifacts docker images describe "$${worker_image}" --format='value(image_summary.digest)')"

        test "$${api_digest#sha256:}" != "$${api_digest}"
        test "$${worker_digest#sha256:}" != "$${worker_digest}"
        [[ "$${api_digest}" =~ ^sha256:[0-9a-f]{64}$$ ]]
        [[ "$${worker_digest}" =~ ^sha256:[0-9a-f]{64}$$ ]]

        printf '%s@%s\n' "$${IMAGE_API_LATEST%:*}" "$${api_digest}" > /workspace/release-api-image-ref
        printf '%s@%s\n' "$${IMAGE_WORKER_LATEST%:*}" "$${worker_digest}" > /workspace/release-worker-image-ref
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        read -r api_image_ref < /workspace/release-api-image-ref
        gcloud run jobs update "$_MIGRATE_JOB" \
          --image "$${api_image_ref}" \
          --region "$_REGION" \
          --quiet
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud beta run jobs execute "$_MIGRATE_JOB" \
          --region "$_REGION" \
          --wait \
          --quiet
  # The scan runner accepts both legacy tokenless claims and new fenced claims.
  # Update it before either service can dispatch the new --claim-token argument.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        read -r worker_image_ref < /workspace/release-worker-image-ref
        gcloud run jobs update "$_ATTACHMENT_SCAN_JOB" \
          --image "$${worker_image_ref}" \
          --region "$_REGION" \
          --quiet
  # Release A deliberately deploys the worker held. Operators restore the
  # captured pre-cutover values only after reconciliation and verification.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        read -r worker_image_ref < /workspace/release-worker-image-ref
        gcloud run services update "$_WORKER_SERVICE" \
          --image "$${worker_image_ref}" \
          --update-env-vars "WORKER_CUTOVER_HOLD=true,EMAIL_DELIVERY_DISPATCH_ENABLED=false" \
          --region "$_REGION" \
          --quiet
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        read -r api_image_ref < /workspace/release-api-image-ref
        gcloud run services update "$_API_SERVICE" \
          --image "$${api_image_ref}" \
          --region "$_REGION" \
          --quiet
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        read -r worker_image_ref < /workspace/release-worker-image-ref
        gcloud run jobs update "$_CLAMAV_UPDATE_JOB" \
          --image "$${worker_image_ref}" \
          --region "$_REGION" \
          --quiet
images:
  - "$_IMAGE_API"
  - "$_IMAGE_WORKER"
options:
  # BYOSA (build.service_account) requires Cloud Logging or an explicit logs bucket.
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: "us-central1"
  _API_SERVICE: "crm-api"
  _WORKER_SERVICE: "crm-worker"
  _MIGRATE_JOB: "crm-migrate"
  _CACHE_BUST: "0"
  _IMAGE_API: "us-central1-docker.pkg.dev/probable-dream-484923-n7/crm/api:latest"
  _IMAGE_WORKER: "us-central1-docker.pkg.dev/probable-dream-484923-n7/crm/worker:latest"
  _CLAMAV_UPDATE_JOB: "crm-clamav-update"
  _ATTACHMENT_SCAN_JOB: "crm-attachment-scan"
