steps:
  - name: gcr.io/cloud-builders/docker
    id: build-web
    entrypoint: bash
    env:
      - "DOCKER_BUILDKIT=1"
      - "IMAGE_WEB=$_IMAGE_WEB"
      - "CACHE_BUST=$_CACHE_BUST"
      - "NEXT_PUBLIC_API_BASE_URL=$_API_BASE_URL"
      - "NEXT_DEPLOYMENT_ID=$BUILD_ID"
    args: ["scripts/build_web_image.sh"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_IMAGE_WEB"]
  - name: gcr.io/cloud-builders/gcloud
    args: ["run", "services", "update", "$_WEB_SERVICE", "--image", "$_IMAGE_WEB", "--region", "$_REGION", "--port", "3000", "--quiet"]
images:
  - "$_IMAGE_WEB"
options:
  # BYOSA (build.service_account) requires Cloud Logging or an explicit logs bucket.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
substitutions:
  _REGION: "us-central1"
  _WEB_SERVICE: "crm-web"
  _CACHE_BUST: "0"
  _IMAGE_WEB: "us-central1-docker.pkg.dev/probable-dream-484923-n7/crm/web:latest"
  _API_BASE_URL: "https://api.surrogacyforce.com"
